<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels de Planifinca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Seguimiento de reels: cada tema es una fila con sus versiones; el estado se lee por la pastilla y el borde.
   Página estática (GitHub Pages o abierta en local). Los datos van en el bloque <script id="datos"> de abajo. */
*{box-sizing:border-box}
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#1F2921; --muted:#5E6B60; --line:#DCE2D8;
  --gold:#A8711A; --gold-soft:#F6E7C8; --green:#2F6B45; --green-soft:#DDEBDD; --blue:#2D5F86; --blue-soft:#DCE8F2;
  --grey-soft:#E9ECE6; color-scheme:light;
  --display:"Urbanist",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161D17; --surface:#1F2921; --ink:#EEF2EA; --muted:#A3B1A5; --line:#334036;
  --gold:#E0A03A; --gold-soft:#3A3120; --green:#8FC79A; --green-soft:#24372A; --blue:#8DB8DC; --blue-soft:#22313D;
  --grey-soft:#2A342C; color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.today{background:var(--gold-soft);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.today h2{margin:0;font-family:var(--display);font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
.today p{margin:0;white-space:pre-line}
.today .pick{font-family:var(--display);font-weight:800;font-size:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.filters,.tools{display:flex;flex-wrap:wrap;gap:8px}
.bar button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.panel textarea{width:100%;min-height:120px;font:13px ui-monospace,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.panel .row{display:flex;flex-wrap:wrap;gap:8px}
.panel button{font:600 14px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.msg{font-size:14px;color:var(--muted);margin:0}
.group{display:grid;gap:8px}
.group h3{margin:6px 0 0;font-family:var(--display);font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;border-left-width:5px}
.topic[data-state="subido"]{border-left-color:var(--green)}
.topic[data-state="programado"]{border-left-color:var(--blue)}
.topic-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:2ch}
.name{font-family:var(--display);font-weight:700;font-size:18px;flex:1 1 200px;min-width:0}
.note{font-size:13px;color:var(--muted)}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.topic-head + .ver, .note + .ver{border-top:0;padding-top:0}
.ver-info{min-width:0}
.ver-info strong{font-weight:600}
.file{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;max-width:100%}
.seg button{font:600 13px var(--body);border:0;background:transparent;color:var(--muted);padding:8px 10px;min-height:38px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="pendiente"]{background:var(--grey-soft);color:var(--ink)}
.seg button[aria-pressed="true"][data-v="programado"]{background:var(--blue-soft);color:var(--blue)}
.seg button[aria-pressed="true"][data-v="subido"]{background:var(--green-soft);color:var(--green)}
.when{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.when input{font:500 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ver{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reels de Planifinca</h1>
    <p class="lead">Qué vídeos tienes, en qué versión y cuáles ya están en TikTok. Lo que marcas se guarda en este navegador; para pasarlo a otro dispositivo usa «Copiar estado» y «Pegar estado».</p>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="stat"><b id="s-temas">–</b><span>temas</span></div>
    <div class="stat"><b id="s-subidos">–</b><span>subidos</span></div>
    <div class="stat"><b id="s-prog">–</b><span>programados</span></div>
    <div class="stat"><b id="s-pend">–</b><span>por subir</span></div>
  </section>

  <section class="today" id="today" hidden>
    <h2 id="today-title">Para hoy</h2>
    <p class="pick" id="today-pick"></p>
    <p id="today-why"></p>
  </section>

  <div class="bar">
    <nav class="filters" aria-label="Filtrar">
      <button type="button" data-f="todos" aria-pressed="true">Todos</button>
      <button type="button" data-f="pendiente" aria-pressed="false">Por subir</button>
      <button type="button" data-f="programado" aria-pressed="false">Programados</button>
      <button type="button" data-f="subido" aria-pressed="false">Subidos</button>
    </nav>
    <div class="tools">
      <button type="button" id="b-copy">Copiar estado</button>
      <button type="button" id="b-paste">Pegar estado</button>
    </div>
  </div>

  <section class="panel" id="panel" hidden>
    <label for="t-estado" id="panel-label">Estado</label>
    <textarea id="t-estado" spellcheck="false"></textarea>
    <div class="row">
      <button type="button" id="b-apply" hidden>Aplicar</button>
      <button type="button" id="b-close">Cerrar</button>
    </div>
    <p class="msg" id="panel-msg"></p>
  </section>

  <main id="list"><div class="empty">Cargando la lista de vídeos…</div></main>
</div>

ión B (demo)", "orden": 2, "archivo": "marketing-tiktok/tanda3_version_b/33_otro_tratamiento.mp4", "duracion": 12, "estado": "pendiente", "fecha": "", "hora": "", "id": "v33-b"}, {"num": 34, "tema": "t34", "titulo": "Recoger entre lluvias", "serie": "lluvia", "version": "Versión A (demo)", "orden": 1, "archivo": "marketing-tiktok/34_recoger_entre_lluvias.mp4", "duracion": 12, "estado": "pendiente", "fecha": "", "hora": "", "id": "v34-a"}, {"num": 34, "tema": "t34", "titulo": "Recoger entre lluvias", "serie": "lluvia", "version": "Versión B (demo)", "orden": 2, "archivo": "marketing-tiktok/tanda3_version_b/34_recoger_entre_lluvias.mp4", "duracion": 12, "estado": "subido", "fecha": "2026-10-20", "hora": "21:30", "id": "v34-b"}, {"num": 35, "tema": "t35", "titulo": "Aceituna con mancha (escudete)", "serie": "lluvia", "version": "App real", "orden": 1, "archivo": "marketing-tiktok/app_real/35_aceituna_con_mancha_app_real.mp4", "duracion": 27, "estado": "programado", "fecha": "2026-10-25", "hora": "22:30", "id": "v35-real"}, {"num": 36, "tema": "t36", "titulo": "En plena recogida (móvil grabado)", "serie": "recogida", "version": "App real", "orden": 1, "archivo": "marketing-tiktok/app_real/36_en_plena_recogida_app_real.mp4", "duracion": 29, "estado": "pendiente", "fecha": "", "hora": "", "id": "v36-real"}, {"num": 36, "tema": "t36", "titulo": "En plena recogida (móvil grabado)", "serie": "recogida", "version": "App real · con mi voz", "orden": 2, "archivo": "marketing-tiktok/app_real/36_en_plena_recogida_app_real_voz.mp4", "duracion": 30, "estado": "programado", "fecha": "2026-10-24", "hora": "22:30", "id": "v36-real-voz"}]}</script>
<script>
(function(){
  const SERIES = { primeros:'Presentación (01-09)', campo:'Campo y temporada (10-15)', cuaderno:'Cuaderno (16-20)', ganchos:'Ganchos del cuaderno (21-25)', tanda3:'Cuaderno, tanda 3 (26-30)', lluvia:'Lluvia y aceituna (31-35)', recogida:'Recogida (36)' };
  const ORDER = Object.keys(SERIES);
  const STATES = [['pendiente','Por subir'],['programado','Programado'],['subido','Subido']];
  const KEY = 'reels-planifinca-estado', FKEY = 'reels-planifinca-filtro';
  const DATA = JSON.parse(document.getElementById('datos').textContent);
  let local = {}, filter = 'todos';
  try { local = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { local = {}; }
  try { filter = localStorage.getItem(FKEY) || 'todos'; } catch (e) {}

  const $ = id => document.getElementById(id);
  const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const videos = () => DATA.videos.map(v => Object.assign({}, v, local[v.id] || {}));
  const topicState = vs => vs.some(v => v.estado === 'subido') ? 'subido' : vs.some(v => v.estado === 'programado') ? 'programado' : 'pendiente';
  function el(tag, attrs, ...kids){ const n = document.createElement(tag); for (const k in (attrs||{})) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); } kids.forEach(c => c && n.appendChild(c)); return n; }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} }

  function save(v, patch){ local[v.id] = Object.assign({}, local[v.id] || {}, patch); persist(); render(); }
  function setState(v, estado){
    if (v.estado === estado) return;
    const patch = { estado };
    if (estado === 'subido' && !v.fecha) patch.fecha = today();
    if (estado === 'pendiente') { patch.fecha = ''; patch.hora = ''; }
    save(v, patch);
  }

  function render(){
    document.querySelectorAll('.filters button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));
    const topics = new Map();
    videos().forEach(v => { if (!topics.has(v.tema)) topics.set(v.tema, []); topics.get(v.tema).push(v); });
    const all = [...topics.values()];
    $('s-temas').textContent = all.length;
    $('s-subidos').textContent = all.filter(t => topicState(t) === 'subido').length;
    $('s-prog').textContent = all.filter(t => topicState(t) === 'programado').length;
    $('s-pend').textContent = all.filter(t => topicState(t) === 'pendiente').length;
    const list = $('list'); list.textContent = '';
    ORDER.forEach(serie => {
      const ts = all.filter(t => t[0].serie === serie && (filter === 'todos' || topicState(t) === filter)).sort((a,b) => a[0].num - b[0].num);
      if (!ts.length) return;
      const g = el('section', {class:'group'}, el('h3', {text: SERIES[serie]}));
      ts.forEach(vs => {
        vs.sort((a,b) => (a.orden||0) - (b.orden||0));
        const t = vs[0];
        const card = el('article', {class:'topic', 'data-state': topicState(vs)});
        card.appendChild(el('div', {class:'topic-head'}, el('span', {class:'num', text: String(t.num).padStart(2,'0')}), el('span', {class:'name', text: t.titulo})));
        if (vs.length > 1) card.appendChild(el('div', {class:'note', text: t.num === 31 ? 'Varias versiones: sube una sola, o 31a y 31b como dos partes.' : 'Dos versiones del mismo tema: sube solo una.'}));
        vs.forEach(v => {
          const seg = el('div', {class:'seg', role:'group', 'aria-label':'Estado de ' + v.version});
          STATES.forEach(([val, label]) => {
            const b = el('button', {type:'button', 'data-v': val, 'aria-pressed': String(v.estado === val), text: label});
            b.addEventListener('click', () => setState(v, val));
            seg.appendChild(b);
          });
          const row = el('div', {class:'ver'}, el('div', {class:'ver-info'}, el('strong', {text: v.version + ' · ' + v.duracion + ' s'}), el('span', {class:'file', text: v.archivo})), seg);
          if (v.estado && v.estado !== 'pendiente') {
            const d = el('input', {type:'date', id:'d-' + v.id, value: v.fecha || '', 'aria-label':'Fecha'});
            const h = el('input', {type:'time', id:'h-' + v.id, value: v.hora || '', 'aria-label':'Hora'});
            d.addEventListener('change', () => save(v, {fecha: d.value}));
            h.addEventListener('change', () => save(v, {hora: h.value}));
            row.appendChild(el('div', {class:'when'}, el('span', {text: v.estado === 'subido' ? 'Subido el' : 'Programado para'}), d, el('span', {text:'a las'}), h));
          }
          card.appendChild(row);
        });
        g.appendChild(card);
      });
      list.appendChild(g);
    });
    if (!list.children.length) list.appendChild(el('div', {class:'empty', text:'Ningún vídeo en este filtro.'}));
  }

  // Estado completo (no solo lo cambiado en este navegador), para llevarlo a otro dispositivo o a Claude
  function stateJson(){
    const out = {};
    videos().forEach(v => { if (v.estado && v.estado !== 'pendiente') out[v.id] = { estado: v.estado, fecha: v.fecha || '', hora: v.hora || '' }; });
    return JSON.stringify(out, null, 1);
  }
  function openPanel(mode){
    $('panel').hidden = false; $('panel-msg').textContent = '';
    const t = $('t-estado');
    if (mode === 'copy') {
      $('panel-label').textContent = 'Estado de esta lista (solo los vídeos programados o subidos)';
      t.value = stateJson(); $('b-apply').hidden = true;
      const done = () => { $('panel-msg').textContent = 'Copiado. Pégalo en «Pegar estado» del otro dispositivo, o pásaselo a Claude para actualizar la página.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); $('panel-msg').textContent = 'Selecciona el texto y cópialo.'; });
      else { t.select(); $('panel-msg').textContent = 'Selecciona el texto y cópialo.'; }
    } else {
      $('panel-label').textContent = 'Pega aquí el estado copiado en otro dispositivo';
      t.value = ''; $('b-apply').hidden = false; t.focus();
    }
  }
  $('b-copy').addEventListener('click', () => openPanel('copy'));
  $('b-paste').addEventListener('click', () => openPanel('paste'));
  $('b-close').addEventListener('click', () => { $('panel').hidden = true; });
  $('b-apply').addEventListener('click', () => {
    let parsed;
    try { parsed = JSON.parse($('t-estado').value); } catch (e) { $('panel-msg').textContent = 'El texto no es un estado válido. Cópialo de nuevo con «Copiar estado».'; return; }
    const ids = new Set(DATA.videos.map(v => v.id));
    // Lo pegado manda: lo que no viene en el texto vuelve a «Por subir»
    local = {};
    DATA.videos.forEach(v => { if (v.estado !== 'pendiente') local[v.id] = { estado: 'pendiente', fecha: '', hora: '' }; });
    Object.keys(parsed || {}).forEach(id => { if (ids.has(id)) local[id] = { estado: parsed[id].estado || 'pendiente', fecha: parsed[id].fecha || '', hora: parsed[id].hora || '' }; });
    persist(); render(); $('panel-msg').textContent = 'Estado aplicado.';
  });

  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; try { localStorage.setItem(FKEY, filter); } catch (e) {} render();
  }));

  if (DATA.hoy && DATA.hoy.recomendacion) {
    $('today').hidden = false;
    $('today-title').textContent = DATA.hoy.titulo || 'Para hoy';
    $('today-pick').textContent = DATA.hoy.recomendacion;
    $('today-why').textContent = DATA.hoy.motivo || '';
  }
  render();
})();
</script>
</body>
